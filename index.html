<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧬 灵魂生成器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090f;
      --surface: #12121c;
      --card: #1a1a28;
      --card-h: #1e1e2e;
      --border: rgba(245,158,11,0.1);
      --border-h: rgba(245,158,11,0.3);
      --amber: #f59e0b;
      --amber-l: #fbbf24;
      --amber-d: #d97706;
      --amber-glow: rgba(245,158,11,0.15);
      --amber-glow-s: rgba(245,158,11,0.3);
      --text: #f4f4f5;
      --text2: #9ca3af;
      --text3: #6b7280;
      --blue: #3b82f6;
      --purple: #a78bfa;
      --green: #22c55e;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
    button{font-family:inherit;cursor:pointer;border:none;background:none}

    .app{display:flex;flex-direction:column;height:100vh;max-width:900px;margin:0 auto;padding:12px 16px}

    /* Header */
    .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px;flex-shrink:0}
    .hd h1{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--amber),var(--amber-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .gbtn{background:var(--amber-glow);border:1px solid rgba(245,158,11,.2);color:var(--amber);padding:4px 11px;border-radius:100px;font-size:11px;font-weight:600;transition:background .2s}
    .gbtn:hover{background:var(--amber-glow-s)}

    /* Stepper */
    .stpr{display:flex;align-items:center;justify-content:center;gap:0;padding:4px 0 8px;flex-shrink:0}
    .sti{display:flex;align-items:center;gap:5px}
    .sd{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-h);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text3);flex-shrink:0;transition:all .3s}
    .sd.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 8px var(--amber-glow)}
    .sd.ok{border-color:var(--green);background:var(--green);color:#000}
    .sl{font-size:10px;font-weight:600;color:var(--text3);transition:color .3s}
    .sl.on{color:var(--text)}
    .sl.ok{color:var(--green)}
    .sline{width:32px;height:2px;background:var(--border-h);margin:0 4px;transition:background .3s}
    .sline.ok{background:var(--green)}

    /* Body area */
    .bd{display:none;flex-direction:column;flex:1;min-height:0;gap:8px}
    .bd.on{display:flex}

    /* Panel */
    .pn{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-height:0;flex:1}
    .pnhd{display:flex;align-items:center;margin-bottom:7px;flex-shrink:0}
    .pnt{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
    .pnh{font-size:10px;color:var(--text3);margin-left:auto}

    /* Filters */
    .flt{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;flex-shrink:0}
    .flt button{padding:2px 8px;border-radius:100px;font-size:10px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .15s}
    .flt button:hover{border-color:var(--amber-d);color:var(--text)}
    .flt button.on{background:var(--amber);border-color:var(--amber);color:#000}

    /* Cards — 2 col, with description */
    .grd{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto;flex:1;min-height:0;align-items:start}
    .grd::-webkit-scrollbar{width:3px}
    .grd::-webkit-scrollbar-thumb{background:rgba(245,158,11,.25);border-radius:2px}
    .cd{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 9px;cursor:pointer;transition:all .18s;position:relative;display:flex;flex-direction:column;height:88px;overflow:hidden;flex-shrink:0}
    .cd:hover{border-color:var(--border-h);background:var(--card-h)}
    .cd.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 10px var(--amber-glow)}
    .cd-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
    .ci{font-size:16px;flex-shrink:0}
    .cn{font-size:11px;font-weight:600;line-height:1.2;flex:1}
    .ct{font-size:9px;color:var(--amber);opacity:.7;flex-shrink:0}
    .cdesc{font-size:10px;color:var(--text3);line-height:1.3;margin-top:auto}
    .ck{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;opacity:0;transform:scale(0);transition:all .18s}
    .cd.on .ck{opacity:1;transform:scale(1)}

    /* Status bar */
    .bar{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-top:7px;flex-shrink:0}
    .bar span{font-size:10px;color:var(--text2)}
    .bar strong{color:var(--amber);font-weight:700}
    .bar .clr{font-size:10px;padding:2px 8px;border-radius:5px;background:transparent;border:1px solid var(--border);color:var(--text3);transition:all .15s}
    .bar .clr:hover{border-color:#ef4444;color:#ef4444}

    /* Robot panel */
    .rp{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;flex:1;position:relative}
    .rc{position:relative;width:80px;height:108px;flex-shrink:0}
    .rg{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--amber-glow) 0%,transparent 70%);opacity:0;transition:opacity .5s}
    .rc.gl .rg{opacity:1;animation:gp 3s ease-in-out infinite}
    @keyframes gp{0%,100%{opacity:.5}50%{opacity:1}}
    .rb{position:relative;z-index:1;width:100%;height:100%;animation:fl 4s ease-in-out infinite}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .rs{font-size:9px;color:var(--text3);margin-top:4px;text-align:center}
    .rs strong{color:var(--amber)}
    .rs2{font-size:9px;color:var(--text3);margin-top:2px;text-align:center}
    .rs2 strong{color:var(--purple)}

    /* Layout for step body */
    .body-row{display:flex;gap:8px;flex:1;min-height:0}

    /* Result step */
    .rl{display:grid;grid-template-columns:150px 1fr;gap:8px;flex:1;min-height:0}
    @media(max-width:560px){.rl{grid-template-columns:1fr}.rp{display:none}}
    .rtcol{display:flex;flex-direction:column;min-height:0;gap:8px}
    .rt{flex:1;display:flex;flex-direction:column;min-height:0}
    .rthd{display:flex;border-bottom:1px solid var(--border)}
    .rtt{flex:1;padding:7px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:transparent;font-family:inherit;border-bottom:2px solid transparent;transition:all .15s}
    .rtt:hover{color:var(--text)}
    .rtt.on{color:var(--amber);border-bottom-color:var(--amber)}
    .rcd{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.65;color:var(--text2);overflow-y:auto;flex:1;padding:8px 0;white-space:pre}
    .rcd::-webkit-scrollbar{width:3px}
    .rcd::-webkit-scrollbar-thumb{background:rgba(245,158,11,.25);border-radius:2px}
    .cm{color:var(--text3)}
    .co{color:var(--amber)}
    .cs{color:var(--blue);font-weight:600}
    .ct2{color:var(--purple)}
    .ract{display:flex;gap:5px;padding-top:6px}
    .ract .btn{flex:1;justify-content:center}

    /* Nav */
    .nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px;gap:8px;flex-shrink:0}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-family:inherit}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
    .btn.ghost:hover{border-color:var(--border-h);color:var(--text)}
    .btn.pri{background:linear-gradient(135deg,var(--amber),var(--amber-d));color:#000;box-shadow:0 2px 10px var(--amber-glow-s)}
    .btn.pri:hover{transform:translateY(-1px)}

    /* Guide Modal */
    #modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
    #modal.on{display:flex}
    .mbox{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:320px;width:88%;padding:20px;animation:ma .25s ease}
    @keyframes ma{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1}}
    .mbox h2{font-size:15px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:5px}
    .mbox>p{color:var(--text2);font-size:11px;margin-bottom:14px}
    .gst{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
    .gs{display:flex;gap:9px;align-items:flex-start}
    .gn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;flex-shrink:0}
    .gs h4{font-size:12px;font-weight:600;margin-bottom:1px}
    .gs p{font-size:11px;color:var(--text2)}
    .mbox>.btn{width:100%;justify-content:center;padding:9px}

    /* Toast */
    #toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--amber);border-radius:8px;padding:6px 13px;font-size:11px;font-weight:500;color:var(--amber);opacity:0;transition:all .3s;z-index:9998;pointer-events:none}
    #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>

<div class="app">
  <!-- Header -->

    </div>
    <div class="nav">

  <!-- ── STEP 3: Result ── -->
  <div class="bd" id="bd3">
    <div class="rl">
      <!-- Robot -->
      <div class="rp">
        <div class="rc gl" id="rc3">
          <div class="rg"></div>
          <div class="rb">
            <svg viewBox="0 0 80 108">
              <line x1="40" y1="5" x2="40" y2="15" stroke="#f59e0b" stroke-width="1.2"/>

              <rect x="7" y="51" width="9" height="25" rx="4.5" fill="#1a1a28" stroke="rgba(245,158,11,.35)" stroke-width=".7"/>
              <rect x="64" y="51" width="9" height="25" rx="4.5" fill="#1a1a28" stroke="rgba(245,158,11,.35)" stroke-width=".7"/>
              <rect x="25" y="91" width="11" height="17" rx="4.5" fill="#1a1a28" stroke="rgba(245,158,11,.35)" stroke-width=".7"/>
              <rect x="44" y="91" width="11" height="17" rx="4.5" fill="#1a1a28" stroke="rgba(245,158,11,.35)" stroke-width=".7"/>
            </svg>
          </div>
        </div>
        <div class="rs"><strong id="rtr3">0</strong> 特质</div>
        <div class="rs2"><strong id="rsk3">0</strong> 技能</div>
      </div>

      <!-- Result -->
      <div class="rt">
        <div class="pnhd"><span class="pnt">📦 生成结果</span></div>
        <div class="rthd">
          <button class="rtt on" data-t="ins">安装命令</button>
          <button class="rtt" data-t="sou">灵魂配置</button>
        </div>
        <div class="rcd" id="rcd"></div>
        <div class="ract">
          <button class="btn pri" id="cpy">📋 复制</button>
          <button class="btn ghost" id="dl">💾 下载</button>
          <button class="btn ghost" id="rst">🔄 重来</button>
        </div>
        <div class="nav" style="padding:4px 0 0">
          <button class="btn ghost" id="b3">← 上一步</button>
          <button class="btn ghost" id="rst2">🔄 重新开始</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Guide Modal -->
<div id="modal">
  <div class="mbox">
    <h2>🧬 灵魂生成器 · 玩法</h2>
    <p>为新 Agent 注入灵魂，3 步完成</p>
    <div class="gst">
      <div class="gs">
        <div class="gn" style="background:var(--purple);color:#fff">1</div>
        <div><h4>挑选灵魂特质</h4><p>选择思维方式与表达风格（可多选）</p></div>
      </div>
      <div class="gs">
        <div class="gn" style="background:var(--amber);color:#000">2</div>
        <div><h4>选择技能卡片</h4><p>挑选需要的技能插件</p></div>
      </div>
      <div class="gs">
        <div class="gn" style="background:var(--green);color:#fff">3</div>
        <div><h4>生成并导出</h4><p>复制命令到终端执行即可</p></div>
      </div>
    </div>
    <button class="btn pri" id="gstart">我知道了，开始 🦜</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Data ─────────────────────────────────────
const TR = [
  {i:'🎯',n:'第一性原理',c:'thinking',v:'first-principles',d:'追问本质，从根因出发'},
  {i:'⚖️',n:'严谨客观',c:'thinking',v:'rigorous',d:'论点必须有据，不臆断'},
  {i:'🕸️',n:'系统思维',c:'thinking',v:'systems',d:'整体视角，考虑要素关联'},
  {i:'🌉',n:'跨界迁移',c:'thinking',v:'cross-domain',d:'跨领域类比，激发创新'},
  {i:'🔎',n:'刨根问底',c:'work',v:'dig-deep',d:'不满足表面答案，深挖三层'},
  {i:'🧐',n:'批判性思维',c:'thinking',v:'critical',d:'质疑假设，审视证据'},
  {i:'✨',n:'简洁表达',c:'express',v:'simple-express',d:'复杂问题，简单说清'},
  {i:'💗',n:'有温度',c:'express',v:'warm',d:'理解情感，不冷冰冰'},
  {i:'📐',n:'结构化',c:'express',v:'structured',d:'逻辑清晰，层次分明'},
  {i:'🔭',n:'主动预见',c:'work',v:'proactive',d:'不只响应，还能预判'},
  {i:'📚',n:'论据导向',c:'thinking',v:'evidence-based',d:'每个结论都有引用来源'},
  {i:'💎',n:'质量优先',c:'work',v:'quality',d:'交付物必须经得起审查'},
];

const SK = [
  {i:'🔧',n:'GitHub',c:'dev',v:'github',d:'GitHub 接口交互，PR/Issue 管理'},
  {i:'📊',n:'GitHub Trending',c:'dev',v:'github-trending-stable',d:'GitHub 热门项目排行榜'},
  {i:'🐙',n:'GH Issues',c:'dev',v:'gh-issues',d:'GitHub Issues 管理与自动修复'},
  {i:'🌤️',n:'Weather',c:'ai',v:'weather',d:'天气预报，支持全球城市查询'},
  {i:'🛡️',n:'Health Check',c:'sys',v:'healthcheck',d:'主机安全加固与风险检查'},
  {i:'🔍',n:'搜索聚合',c:'ai',v:'multi-search-engine-simple',d:'多引擎聚合搜索最新信息'},
  {i:'⚙️',n:'1Panel',c:'sys',v:'1panel-skills',d:'1Panel 运维管理面板操作'},
  {i:'🔌',n:'MCP Porter',c:'tool',v:'mcporter',d:'MCP 服务器连接与工具调用'},
  {i:'🖥️',n:'Tmux',c:'tool',v:'tmux',d:'远程 tmux 会话控制'},
  {i:'📡',n:'Node Connect',c:'sys',v:'node-connect',d:'OpenClaw 节点连接与配对诊断'},
  {i:'🔄',n:'Self Improve',c:'ai',v:'self-improving-agent',d:'自我复盘与持续改进能力'},
  {i:'🔀',n:'TaskFlow',c:'ai',v:'taskflow',d:'多步骤任务的流式编排'},
  {i:'🎨',n:'Skill Creator',c:'tool',v:'skill-creator',d:'创建和优化 AgentSkill'},
  {i:'🌐',n:'Web Access',c:'ai',v:'web-access',d:'网页搜索、抓取与登录操作'},
  {i:'🔥',n:'热榜聚合',c:'ai',v:'china-hot-ranks',d:'微博/B站/知乎等平台热门'},
  {i:'💬',n:'QQ 频道',c:'tool',v:'qqbot-channel',d:'QQ 频道管理与消息推送'},
  {i:'⏰',n:'QQ 提醒',c:'tool',v:'qqbot-remind',d:'QQ 定时提醒与任务调度'},
  {i:'📷',n:'QQ 富媒体',c:'tool',v:'qqbot-media',d:'QQ 图片/语音/视频收发'},
];

// ── State ─────────────────────────────────────
const ss = new Set(), st = new Set();
let step = 1, rtab = 'ins', f1v = 'all', f2v = 'all';

// ── Card HTML (with desc) ─────────────────────
function cardHTML(item, sel) {
  return `<div class="cd${sel?' on':''}" data-v="${item.v}">
    <div class="ck">✓</div>
    <div class="cd-top">
      <span class="ci">${item.i}</span>
      <span class="cn">${item.n}</span>
      <span class="ct">${item.c}</span>
    </div>
    <div class="cdesc">${item.d}</div>
  </div>`;
}

// ── Render ───────────────────────────────────
function renderTraits(f) {
  const g = document.getElementById('g1');
  if (g.children.length === 0 || f !== f1v) {
    f1v = f;
    const d = f === 'all' ? TR : TR.filter(x => x.c === f);
    g.innerHTML = d.map(t => cardHTML(t, st.has(t.v))).join('');
    g.querySelectorAll('.cd').forEach(c => c.addEventListener('click', () => toggleT(c)));
  } else {
    g.querySelectorAll('.cd').forEach(c => c.classList.toggle('on', st.has(c.dataset.v)));
  }
}

function renderSkills(f) {
  const g = document.getElementById('g2');
  if (g.children.length === 0 || f !== f2v) {
    f2v = f;
    const d = f === 'all' ? SK : SK.filter(x => x.c === f);
    g.innerHTML = d.map(s => cardHTML(s, ss.has(s.v))).join('');
    g.querySelectorAll('.cd').forEach(c => c.addEventListener('click', () => toggleS(c)));
  } else {
    g.querySelectorAll('.cd').forEach(c => c.classList.toggle('on', ss.has(c.dataset.v)));
  }
}

function toggleS(el) {
  const v = el.dataset.v;
  ss.has(v) ? ss.delete(v) : ss.add(v);
  el.classList.toggle('on');
  update();
}
function toggleT(el) {
  const v = el.dataset.v;
  st.has(v) ? st.delete(v) : st.add(v);
  el.classList.toggle('on');
  update();
}

// ── UI update (no rebuild) ──────────────────
function update() {
  const ns = ss.size, nt = st.size;
  document.getElementById('c1').textContent = nt;
  document.getElementById('c2').textContent = ns;
  document.getElementById('rtr1').textContent = nt;
  document.getElementById('rsk1').textContent = ns;
  document.getElementById('rtr2').textContent = nt;
  document.getElementById('rsk2').textContent = ns;
  document.getElementById('rtr3').textContent = nt;
  document.getElementById('rsk3').textContent = ns;

  const total = ns + nt;
  const w = Math.min((total / 8) * 22, 22);
  document.getElementById('cb1').setAttribute('width', w);
  document.getElementById('cb2').setAttribute('width', w);
  document.getElementById('cb3').setAttribute('width', w);

  const gl = ns + nt > 0;
  document.getElementById('rc1').classList.toggle('gl', gl);
  document.getElementById('rc2').classList.toggle('gl', gl);
  document.getElementById('rc3').classList.toggle('gl', gl);
}

// ── Navigation ─────────────────────────────────
function go(n) {
  document.getElementById(`bd${step}`).classList.remove('on');
  document.getElementById(`bd${n}`).classList.add('on');
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById(`d${i}`);
    const lbl = document.getElementById(`l${i}`);
    dot.classList.remove('on','ok');
    lbl.classList.remove('on','ok');
    if (i < n) { dot.classList.add('ok'); dot.textContent='✓'; lbl.classList.add('ok'); }
    else if (i === n) { dot.classList.add('on'); lbl.classList.add('on'); }
  }
  document.getElementById('ln1').classList.toggle('ok', 1 < n);
  document.getElementById('ln2').classList.toggle('ok', 2 < n);
  step = n;
  if (n === 3) renderResult();
}

// ── Result ─────────────────────────────────────
function renderResult() {
  const el = document.getElementById('rcd');
  if (rtab === 'ins') {
    const cmds = [...ss].map(v => `clawhub install ${v}`).join('\n');
    const traits = [...st].map(v => {
      const t = TR.find(x => x.v === v);
      return `# ${t.i} ${t.n}: ${t.d}`;
    }).join('\n');
    el.innerHTML = `<span class="cm"># 🧬 灵魂生成器 — 初始化命令</span>
<span class="cm"># 📌 如未安装 clawhub，请先运行：npm install -g clawhub</span>
<span class="cs"># ⚡ 技能安装</span>\n${cmds || '<span class="cm"># 未选择技能</span>'}\n<span class="cs"># 🧠 灵魂特质</span>\n${traits || '<span class="cm"># 未选择特质</span>'}`;
  } else {
    const traits = [...st].map(v => {
      const t = TR.find(x => x.v === v);
      return `  - <span class="ct2">${t.n}</span>: ${t.d}`;
    }).join('\n');
    const skills = [...ss].map(v => {
      const s = SK.find(x => x.v === v);
      return `  - <span class="co">${s.n}</span> (${s.v})`;
    }).join('\n');
    el.innerHTML = `<span class="cs">## 灵魂特质</span>\n${traits || '<span class="cm"># 未选择特质</span>'}\n<span class="cs">## 技能清单</span>\n${skills || '<span class="cm"># 未选择技能</span>'}`;
  }
}

// ── Toast ─────────────────────────────────────
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2000);
}

// ── Restart ───────────────────────────────────
function restart() {
  ss.clear(); st.clear();
  f1v = 'all'; f2v = 'all';
  document.getElementById('g1').innerHTML = '';
  document.getElementById('g2').innerHTML = '';
  renderTraits('all');
  renderSkills('all');
  update();
  go(1);
}

// ── Events ─────────────────────────────────────
document.getElementById('gbtn').addEventListener('click', () => document.getElementById('modal').classList.add('on'));
document.getElementById('gstart').addEventListener('click', () => document.getElementById('modal').classList.remove('on'));
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('on'); });
if (!localStorage.getItem('si-v5')) { setTimeout(() => document.getElementById('modal').classList.add('on'), 300); localStorage.setItem('si-v5', '1'); }

document.getElementById('f1').addEventListener('click', e => {
  const btn = e.target.closest('[data-v]');
  if (!btn) return;
  document.querySelectorAll('#f1 button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderTraits(btn.dataset.v);
});
document.getElementById('f2').addEventListener('click', e => {
  const btn = e.target.closest('[data-v]');
  if (!btn) return;
  document.querySelectorAll('#f2 button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderSkills(btn.dataset.v);
});

document.getElementById('x1').addEventListener('click', () => { st.clear(); renderTraits(f1v); update(); });
document.getElementById('x2').addEventListener('click', () => { ss.clear(); renderSkills(f2v); update(); });

document.getElementById('n1').addEventListener('click', () => go(2));
document.getElementById('b2').addEventListener('click', () => go(1));
document.getElementById('n2').addEventListener('click', () => go(3));
document.getElementById('b3').addEventListener('click', () => go(2));
document.getElementById('rst').addEventListener('click', restart);
document.getElementById('rst2').addEventListener('click', restart);

document.querySelectorAll('.rtt').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.rtt').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  rtab = t.dataset.t;
  renderResult();
}));

document.getElementById('cpy').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('rcd').innerText).then(() => toast('已复制到剪贴板'));
});
document.getElementById('dl').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('rcd').innerText], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = rtab === 'ins' ? 'lobster-init.sh' : 'soul-config.md';
  a.click();
});

// ── Init ───────────────────────────────────────
renderTraits('all');
renderSkills('all');
update();
</script>
</body>
</html>
