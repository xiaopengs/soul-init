<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧬 Agent Harness Builder</title>
  <style>
    :root {
      --bg: #080810;
      --surface: #0f0f1d;
      --card: #16162a;
      --card-h: #1c1c34;
      --border: rgba(245,158,11,0.08);
      --border-h: rgba(245,158,11,0.25);
      --amber: #f59e0b;
      --amber-l: #fbbf24;
      --amber-d: #d97706;
      --amber-glow: rgba(245,158,11,0.12);
      --amber-glow-s: rgba(245,158,11,0.28);
      --text: #f4f4f5;
      --text2: #9ca3af;
      --text3: #5f6780;
      --blue: #3b82f6;
      --purple: #a78bfa;
      --green: #22c55e;
      --red: #ef4444;
      --cyan: #06b6d4;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:rgba(245,158,11,.18);border-radius:2px}

    .app{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}

    /* ── Header ── */
    .hd{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .hd-l{display:flex;align-items:center;gap:8px}
    .hd h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--amber),var(--amber-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .hd-badge{font-size:9px;padding:2px 8px;border-radius:100px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--amber);font-weight:600;white-space:nowrap}
    .hd-hint{font-size:10px;color:var(--text3)}

    /* ── Role Selector ── */
    .rs{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
    .rs-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .2s;white-space:nowrap}
    .rs-btn:hover{border-color:var(--border-h);color:var(--text);background:var(--card-h)}
    .rs-btn.on{border-color:var(--amber);background:rgba(245,158,11,.08);color:var(--amber);box-shadow:0 0 12px var(--amber-glow)}
    .rs-btn .ri{font-size:16px}
    .rs-info{font-size:9px;color:var(--text3);margin-left:2px;opacity:.7}

    /* ── Framework Diagram ── */
    .fw{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 0;flex-shrink:0;-webkit-overflow-scrolling:touch}
    .fw::-webkit-scrollbar{height:2px}
    .fn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;min-width:72px;position:relative;flex-shrink:0}
    .fn:hover{border-color:var(--border-h);background:var(--card-h)}
    .fn.active{border-color:var(--amber);background:rgba(245,158,11,.06);box-shadow:0 0 14px var(--amber-glow)}
    .fn .fe{font-size:20px;line-height:1}
    .fn .fl{font-size:9px;font-weight:600;color:var(--text2);text-align:center;line-height:1.2;min-height:22px;word-break:keep-all}
    .fn.active .fl{color:var(--amber)}
    .fn .fg{font-size:8px;color:var(--amber);opacity:.5}
    .fn.has-gate .fg{opacity:1;font-weight:700}
    /* connectors */
    .fc{display:flex;align-items:center;padding:0 1px;flex-shrink:0}
    .fc svg{width:18px;height:18px}
    .fc line{stroke:rgba(245,158,11,.2);stroke-width:1.2}
    .fc polyline{stroke:rgba(245,158,11,.2);stroke-width:1.2;fill:none}

    /* ── Stage Detail Panel ── */
    .sd{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
    .sd-hd{display:flex;align-items:center;gap:8px}
    .sd-num{width:26px;height:26px;border-radius:50%;border:2px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--amber);flex-shrink:0}
    .sd-name{font-size:14px;font-weight:700}
    .sd-gate{font-size:9px;padding:1px 6px;border-radius:100px;background:rgba(245,158,11,.15);color:var(--amber);font-weight:600;margin-left:4px}
    .sd-desc{font-size:11px;color:var(--text2);margin-left:34px;line-height:1.5}

    /* ── Skill Grid ── */
    .sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px}
    .sk{display:flex;align-items:flex-start;gap:7px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .18s;position:relative}
    .sk:hover{border-color:var(--border-h);background:var(--card-h)}
    .sk.on{border-color:var(--amber);box-shadow:0 0 0 1px rgba(245,158,11,.3),0 0 8px var(--amber-glow)}
    .sk.on .sk-ind{transform:scale(1);opacity:1}
    .sk-em{font-size:16px;flex-shrink:0;margin-top:1px}
    .sk-body{flex:1;min-width:0}
    .sk-name{font-size:11px;font-weight:600;line-height:1.3}
    .sk-desc{font-size:9px;color:var(--text3);line-height:1.3;margin-top:1px}
    .sk-ind{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:8px;color:#000;opacity:0;transform:scale(0);transition:all .18s}
    .sk-rec{font-size:8px;padding:1px 5px;border-radius:100px;background:rgba(34,197,94,.1);color:var(--green);font-weight:500;margin-left:4px;white-space:nowrap}
    .sk-ext{font-size:8px;padding:1px 5px;border-radius:100px;background:rgba(6,182,212,.1);color:var(--cyan);font-weight:500;margin-left:4px;white-space:nowrap}

    /* ── Actions ── */
    .sact{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-left:34px}
    .sact .rbtn{font-size:10px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);color:var(--text3);transition:all .15s}
    .sact .rbtn:hover{border-color:var(--green);color:var(--green)}
    .sact em{font-size:10px;color:var(--text3);font-style:normal}

    /* ── Bottom Bar ── */
    .bb{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;flex-shrink:0}
    .bb-l{font-size:12px;color:var(--text2)}
    .bb-l strong{color:var(--amber);font-weight:700}
    .bb-r{display:flex;gap:6px}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:9px;font-size:12px;font-weight:600;transition:all .2s;font-family:inherit}
    .btn.ghost{border:1px solid var(--border);color:var(--text2);background:transparent}
    .btn.ghost:hover{border-color:var(--border-h);color:var(--text)}
    .btn.pri{background:linear-gradient(135deg,var(--amber),var(--amber-d));color:#000;box-shadow:0 2px 12px var(--amber-glow-s)}
    .btn.pri:hover{transform:translateY(-1px)}

    /* ── Modal ── */
    .modal-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
    .modal-overlay.on{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:460px;width:92%;max-height:85vh;display:flex;flex-direction:column;animation:mo .25s ease}
    @keyframes mo{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1}}
    .modal-hd{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}
    .modal-hd h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
    .modal-close{font-size:18px;color:var(--text3);padding:4px;transition:color .15s}
    .modal-close:hover{color:var(--text)}
    .modal-body{flex:1;overflow-y:auto;padding:8px 18px 16px}
    .modal-body pre{font-family:'JetBrains Mono','Cascadia Code',monospace;font-size:11px;line-height:1.6;color:var(--text2);white-space:pre-wrap;word-break:break-all;margin:0}
    .modal-body .cm{color:var(--text3)}
    .modal-body .kw{color:var(--amber)}
    .modal-body .sk{color:var(--blue)}
    .modal-body .gt{color:var(--green)}
    .modal-body .pl{color:var(--purple)}
    .modal-ft{padding:8px 18px 16px;display:flex;gap:8px}
    .modal-ft .btn{flex:1;justify-content:center}

    /* ── Toast ── */
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--amber);border-radius:8px;padding:7px 14px;font-size:11px;font-weight:500;color:var(--amber);opacity:0;transition:all .3s;z-index:9998;pointer-events:none}
    #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ── Particles BG ── */
    .particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .particle{position:absolute;width:2px;height:2px;background:var(--amber);border-radius:50%;opacity:.15;animation:float-up 8s linear infinite}
    @keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.15}90%{opacity:.1}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}

    @media(max-width:500px){
      .sg{grid-template-columns:1fr}
      .fw{gap:0;padding:4px 0}
      .fn{padding:7px 8px;min-width:58px}
      .fn .fl{font-size:8px}
      .fn .fe{font-size:17px}
      .fc svg{width:12px;height:12px}
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="app">
  <!-- Header -->
  <div class="hd">
    <div class="hd-l">
      <h1>🧬 Agent Harness Builder</h1>
      <span class="hd-badge">Harness Engineering</span>
    </div>
    <span class="hd-hint">选择一个角色开始组装</span>
  </div>

  <!-- Role Selector -->
  <div class="rs" id="roleSelector"></div>

  <!-- Framework Diagram -->
  <div class="fw" id="framework"></div>

  <!-- Stage Detail -->
  <div class="sd" id="stageDetail">
    <div class="sd-hd">
      <div class="sd-num" id="sdNum">1</div>
      <span class="sd-name" id="sdName"></span>
      <span class="sd-gate" id="sdGate" style="display:none">⭐ 强制门禁</span>
    </div>
    <div class="sd-desc" id="sdDesc"></div>
    <div class="sact">
      <em id="sdSkillCount">已选 0 项</em>
      <button class="rbtn" id="resetNodeBtn">↺ 恢复推荐</button>
    </div>
    <div class="sg" id="skillGrid"></div>
  </div>

  <!-- Bottom Bar -->
  <div class="bb">
    <div class="bb-l">已装配 <strong id="totalCount">0</strong> 个 Skill，覆盖 <strong id="stageCount">0</strong> 个阶段</div>
    <div class="bb-r">
      <button class="btn ghost" id="resetAllBtn">↺ 全部重置</button>
      <button class="btn pri" id="generateBtn">⚡ 生成 Harness 配置</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hd">
      <h2>📋 Harness 配置</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <pre id="modalContent"></pre>
    </div>
    <div class="modal-ft">
      <button class="btn ghost" id="copyBtn">📋 复制</button>
      <button class="btn pri" id="downloadBtn">⬇ 下载 .md</button>
    </div>
  </div>
</div>

<div id="toast"></div>

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let activeRoleIdx = 0;
let activeStageIdx = 0;
// selections: { roleId: { stageId: Set<skillId> } } — initialized from recommended
let selections = {};

function initSelections() {
  selections = {};
  ROLES.forEach(r => {
    selections[r.id] = {};
    r.stages.forEach(s => {
      selections[r.id][s.id] = new Set([...s.recommended]);
    });
  });
}

function getSelection(roleId, stageId) {
  return selections[roleId]?.[stageId] ?? new Set();
}

function toggleSkill(roleId, stageId, skillId) {
  const set = selections[roleId][stageId];
  if (set.has(skillId)) set.delete(skillId);
  else set.add(skillId);
}

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════

// Role Selector
function renderRoleSelector() {
  const el = document.getElementById('roleSelector');
  el.innerHTML = ROLES.map((r,i) => `
    <button class="rs-btn${i===activeRoleIdx?' on':''}" data-idx="${i}">
      <span class="ri">${r.emoji}</span>${r.name}
      <span class="rs-info">${r.harnessType}</span>
    </button>
  `).join('');
  el.querySelectorAll('.rs-btn').forEach(b => {
    b.onclick = () => { activeRoleIdx = +b.dataset.idx; activeStageIdx = 0; renderAll(); };
  });
}

// Framework Diagram
function renderFramework() {
  const role = ROLES[activeRoleIdx];
  const el = document.getElementById('framework');
  const items = role.stages.map((s, i) => {
    const isActive = i === activeStageIdx;
    const gateLabel = s.hasGate ? '⭐'.repeat(s.id==='develop'?2:1) : '';
    return `<div class="fn${isActive?' active':''}${s.hasGate?' has-gate':''}" data-stage="${i}">
      <span class="fe">${s.emoji}</span>
      <span class="fl">${s.name}</span>
      ${gateLabel ? `<span class="fg">${gateLabel}</span>` : ''}
    </div>`;
  });
  const connectors = role.stages.slice(1).map((_, i) => `
    <div class="fc">
      <svg viewBox="0 0 18 18"><line x1="0" y1="9" x2="14" y2="9"/><polyline points="10,5 14,9 10,13"/></svg>
    </div>
  `);
  const all = [];
  items.forEach((item, i) => { all.push(item); if (i < connectors.length) all.push(connectors[i]); });
  el.innerHTML = all.join('');
  el.querySelectorAll('.fn').forEach(fn => {
    fn.onclick = () => { activeStageIdx = +fn.dataset.stage; renderStageDetail(); renderFramework(); updateStats(); };
  });
}

// Stage Detail + Skills
function renderStageDetail() {
  const role = ROLES[activeRoleIdx];
  const stage = role.stages[activeStageIdx];
  const sel = getSelection(role.id, stage.id);

  document.getElementById('sdNum').textContent = activeStageIdx + 1;
  document.getElementById('sdName').textContent = stage.name.replace(/ ⭐+/g, '');
  document.getElementById('sdDesc').textContent = stage.desc;
  const gateEl = document.getElementById('sdGate');
  gateEl.style.display = stage.hasGate ? 'inline-block' : 'none';
  if (stage.hasGate) {
    const count = stage.id === 'develop' ? 2 : 1;
    gateEl.textContent = '⭐'.repeat(count) + ' 强制门禁';
  }
  document.getElementById('sdSkillCount').textContent = `已选 ${sel.size} / ${stage.skills.length} 项`;

  const grid = document.getElementById('skillGrid');
  grid.innerHTML = stage.skills.map(sid => {
    const sk = SKILLS[sid];
    if (!sk) return '';
    const isOn = sel.has(sid);
    const isRec = stage.recommended.includes(sid);
    const isExt = !isRec; // extended (not recommended)
    return `<div class="sk${isOn?' on':''}" data-sid="${sid}">
      <span class="sk-em">${sk.emoji}</span>
      <div class="sk-body">
        <span class="sk-name">${sk.name}${isRec?' <span class="sk-rec">推荐</span>':''}${isExt?' <span class="sk-ext">扩展</span>':''}</span>
        <div class="sk-desc">${sk.desc}</div>
      </div>
      <span class="sk-ind">✓</span>
    </div>`;
  }).join('');

  grid.querySelectorAll('.sk').forEach(card => {
    card.onclick = () => {
      toggleSkill(role.id, stage.id, card.dataset.sid);
      renderStageDetail();
      updateStats();
    };
  });

  document.getElementById('resetNodeBtn').onclick = () => {
    selections[role.id][stage.id] = new Set([...stage.recommended]);
    renderStageDetail();
    updateStats();
  };
}

function updateStats() {
  const role = ROLES[activeRoleIdx];
  let totalSkills = 0;
  let stagesWithSelection = 0;
  role.stages.forEach(s => {
    const sel = getSelection(role.id, s.id);
    totalSkills += sel.size;
    if (sel.size > 0) stagesWithSelection++;
  });
  document.getElementById('totalCount').textContent = totalSkills;
  document.getElementById('stageCount').textContent = stagesWithSelection;
}

function renderAll() {
  renderRoleSelector();
  renderFramework();
  renderStageDetail();
  updateStats();
}

// ═══════════════════════════════════════════
//  MD GENERATION
// ═══════════════════════════════════════════
function generateMD() {
  const role = ROLES[activeRoleIdx];
  const now = new Date().toISOString().slice(0,10);
  const allSkillIds = new Set();
  role.stages.forEach(s => {
    getSelection(role.id, s.id).forEach(sid => allSkillIds.add(sid));
  });

  let md = '';
  md += `# Agent Harness 配置\n\n`;
  md += `> 生成时间：${now}\n`;
  md += `> 角色：${role.emoji} ${role.name}\n`;
  md += `> Harness 类型：${role.harnessType}\n`;
  md += `> ${role.harnessDesc}\n\n`;
  md += `---\n\n`;

  // Pipeline overview
  md += `## 🔗 Harness 管线\n\n`;
  md += `\`\`\`\n`;
  md += role.stages.map((s, i) => `${s.emoji} ${s.name}${i < role.stages.length-1 ? ' → ' : ''}`).join('');
  md += `\n\`\`\`\n\n`;

  // Stage details
  role.stages.forEach((s, i) => {
    const sel = getSelection(role.id, s.id);
    const stageName = s.name.replace(/ ⭐+/g, '');
    md += `### Stage ${i+1}: ${s.emoji} ${stageName}`;
    if (s.hasGate) {
      const count = s.id === 'develop' ? 2 : 1;
      md += ` ${'⭐'.repeat(count)}`;
      md += `\n> 🚧 **强制门禁** — 必须通过方可进入下一阶段\n`;
    }
    md += `\n${s.desc}\n\n`;
    md += `**装配 Skill (${sel.size}):**\n\n`;
    if (sel.size === 0) {
      md += `- *(未选择)*\n\n`;
    } else {
      [...sel].forEach(sid => {
        const sk = SKILLS[sid];
        md += `- **${sk.emoji} ${sk.name}** — ${sk.desc}\n`;
      });
      md += `\n`;
    }
  });

  // Install command
  md += `---\n\n`;
  md += `## 📦 安装命令\n\n`;
  md += `\`\`\`bash\n`;
  md += `clawhub install ${[...allSkillIds].join(' ')}\n`;
  md += `\`\`\`\n\n`;

  // Skill install details
  md += `## 📋 Skill 清单\n\n`;
  md += `| Skill | 描述 | 阶段 |\n`;
  md += `|-------|------|------|\n`;
  role.stages.forEach(s => {
    const sel = getSelection(role.id, s.id);
    [...sel].forEach(sid => {
      const sk = SKILLS[sid];
      md += `| ${sk.emoji} ${sk.name} | ${sk.desc} | ${s.name.replace(/ ⭐+/g, '')} |\n`;
    });
  });

  return md;
}

function showModal() {
  const md = generateMD();
  document.getElementById('modalContent').textContent = md;
  document.getElementById('modal').classList.add('on');
}

function hideModal() {
  document.getElementById('modal').classList.remove('on');
}

async function copyMD() {
  const md = generateMD();
  try {
    await navigator.clipboard.writeText(md);
    toast('✅ 已复制到剪贴板');
  } catch {
    toast('❌ 复制失败，请手动选择复制');
  }
}

function downloadMD() {
  const role = ROLES[activeRoleIdx];
  const md = generateMD();
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `agent-harness-${role.id}-${new Date().toISOString().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ 已下载配置文件');
}

function resetAll() {
  initSelections();
  renderAll();
  toast('↺ 已恢复全部推荐配置');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2000);
}

// ═══════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════
function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    p.style.width = (1 + Math.random() * 2) + 'px';
    p.style.height = p.style.width;
    container.appendChild(p);
  }
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.getElementById('generateBtn').onclick = showModal;
document.getElementById('modalClose').onclick = hideModal;
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) hideModal(); });
document.getElementById('copyBtn').onclick = copyMD;
document.getElementById('downloadBtn').onclick = downloadMD;
document.getElementById('resetAllBtn').onclick = resetAll;

document.addEventListener('keydown', e => { if (e.key === 'Escape') hideModal(); });

initSelections();
initParticles();
renderAll();
</script>
